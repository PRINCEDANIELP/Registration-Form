<!DOCTYPE html>
<html lang="en">

<head>
  <title>Registration Form </title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-r from-fuchsia-500 to-cyan-500 ">
  <div class="  min-h-svh   sm:w-3/3 flex justify-center items-center">
    <div class="form-container transform hover:translate-y-1  bg-white  border border-purple-400  rounded-2xl   p-4 ">
      <div class=" justify-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 24 24">

        <path
          d="M12 11c1.71 0 3-1.29 3-3s-1.29-3-3-3-3 1.29-3 3 1.29 3 3 3m0-4c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1m1 5h-2c-2.76 0-5 2.24-5 5v.5c0 .83.67 1.5 1.5 1.5h9c.83 0 1.5-.67 1.5-1.5V17c0-2.76-2.24-5-5-5m-5 5c0-1.65 1.35-3 3-3h2c1.65 0 3 1.35 3 3zm-1.5-6c.47 0 .9-.12 1.27-.33a5.03 5.03 0 0 1-.42-4.52C7.09 6.06 6.8 6 6.5 6 5.06 6 4 7.06 4 8.5S5.06 11 6.5 11m-.39 1H5.5C3.57 12 2 13.57 2 15.5v1c0 .28.22.5.5.5H4c0-1.96.81-3.73 2.11-5m11.39-1c1.44 0 2.5-1.06 2.5-2.5S18.94 6 17.5 6c-.31 0-.59.06-.85.15a5.03 5.03 0 0 1-.42 4.52c.37.21.79.33 1.27.33m1 1h-.61A6.97 6.97 0 0 1 20 17h1.5c.28 0 .5-.22.5-.5v-1c0-1.93-1.57-3.5-3.5-3.5">
        </path>
      </svg>
      </div>
      <h1 class="text-center font-bold text-purple-800 text-2xl mt-  mr-10 ml-10 mb-3"> Registration Form</h1>
      

      <form id="registrationForm" class=" container p-1  ">
        <div class="container grid grid-cols-1">
          
          <label class="mt-2">Name</label>
          
          <input type="text" id="name" placeholder="Enter your name"
            class="  mt-2 pl-2 border rounded  border-purple-400 outline-none">
          <div id="nameError" class="error text-red-600"></div>
        </div>
        <div class="container grid grid-cols-1">
          <label class="mt-2">Email</label>
          <input type="text" id="email" placeholder="Enter your email "
            class=" mt-2 pl-2 border rounded  border-purple-400 outline-none placeholder">
          <div id="emailError" class="error text-red-600 "></div>
        </div>
        <div class="container grid grid-cols-1 ">
          <label class="mt-2">Password</label>
          <input type="password" id="password" placeholder="Enter your password"
            class=" mt-2 pl-2 border rounded  border-purple-400 outline-none">
          <div id="passwordError" class="error text-red-600"></div>
        </div>
        <div class="container grid grid-cols-1  disabled:cursor-not-allowed">
          <button type="submit" id="submitBtn" disabled
            class="container bg-purple-600 text-white p-2 rounded-lg  hover:bg-green-600 disabled:bg-gray-400 mt-7 mb-3 disabled:cursor-not-allowed">
            Register
          </button>

        </div>
      </form>

    </div>
  </div>
  <script>
    let nameInput = document.getElementById("name")
    let emailInput = document.getElementById("email")
    let passwordInput = document.getElementById("password")

    let nameError = document.getElementById("nameError")
    let emailError = document.getElementById("emailError")
    let passwordError = document.getElementById("passwordError")

    let submitBtn = document.getElementById("submitBtn")
    let form = document.getElementById("registrationForm")
    function validateName() {
      if (nameInput.value.trim() === "") {
        nameError.textContent = "Name is required"
        return false;
      } else {
        nameError.textContent = ""
        return true
      }
    }
    function validateEmail() {
      let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (emailInput.value.trim() === "") {
        emailError.textContent = "Email is required"
        return false
      }

      if (!emailPattern.test(emailInput.value)) {
        emailError.textContent = "Enter a valid email address"
        return false;
      }
      else {
        emailError.textContent = ""
        return true;
      }

    }

    function validatePassword() {
      if (passwordInput.value.length < 6) {
        passwordError.textContent =
          "Password must be at least 6 characters"
        return false;
      } else {
        passwordError.textContent = ""
        return true;
      }
    }

    function checkForm() {
      let nameValid = validateName()
      let emailValid = validateEmail()
      let passwordValid = validatePassword()

      submitBtn.disabled =
        !(
          nameValid &&
          emailValid &&
          passwordValid
        )
    }


    nameInput.addEventListener("input", checkForm)
    emailInput.addEventListener("input", checkForm)
    passwordInput.addEventListener("input", checkForm)
    form.addEventListener("submit", function () {
      if (
        validateName() &&
        validateEmail() &&
        validatePassword()
      ) {
        alert("Registration successful!")
      }
    })
  </script>
</body>

</html>
